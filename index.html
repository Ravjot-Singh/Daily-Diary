<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Blog Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <nav>
    <div class="logo"><img class="logo-img" src="/assets/logo_gndec.webp" alt=""> TR-103</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
    </ul>
  </nav>

  <header class="hero">
    <h1>Daily Diary by Ravjot Singh, URN-2302646, GNDEC</h1>
    <p>Training at GNDEC, Ludhiana</p>
  </header>

  <main>

    <div class="button-container">
      <button onclick="openBlog('')">📄 View Final Report</button>
      <button onclick="openBlog('/docs/certificate.pdf')">🎓 View Certificate</button>
    </div>

    <h1 class="blog-heading">Days Report</h1>

    <div class="blog-container"></div>

  </main>

  <script>
    const docs = Array.from({ length: 17 }, (_, i) => ({
      day: i + 1,
      file: `docs/day-${i + 1}.pdf`,
      cover: `cover${(i % 3) + 1}.jpeg`
    }));

    const container = document.querySelector('.blog-container');

    docs.forEach(({ day, file, cover }) => {
      const card = document.createElement("div");
      card.className = "blog-card";
      card.onclick = () => openBlog(file);
      card.innerHTML = `
        <img src="assets/${cover}" alt="Blog ${day}">
        <h2>Day ${day}</h2>
      `;
      container.appendChild(card);
    });

    function openBlog(url) {
      if (!url) return;
      window.open(url, "_blank");
    }
  </script>

</body>

</html>
